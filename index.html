<!DOCTYPE html>
<!-- 한국어 문서임을 알려준다 -->
<html lang="ko">
<head>
  <!-- 한글이 깨지지 않도록 글자 인코딩을 지정한다 -->
  <meta charset="UTF-8" />
  <!-- 휴대폰 화면 너비에 맞춰 보이도록 설정한다 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- 브라우저 탭에 보일 제목 -->
  <title>우리 동네 공기 신호등</title>
  <!-- Pretendard 글꼴을 CDN에서 불러온다 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <!-- 지도 라이브러리 Leaflet의 기본 디자인을 CDN에서 불러온다 -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <!-- 디자인 파일(style.css)을 연결한다 -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- 화면 맨 위 영역: 제목과 시도 선택 드롭다운 -->
  <header class="top-bar">
    <!-- 앱 제목 -->
    <h1 class="app-title">우리 동네 공기 신호등</h1>
    <!-- 시도 선택 영역 -->
    <div class="select-wrap">
      <!-- 드롭다운 이름표 -->
      <label for="sido-select">지역 선택</label>
      <!-- 시도 목록은 app.js에서 채운다 -->
      <select id="sido-select">
        <!-- 처음에 보이는 안내 항목 -->
        <option value="">시도를 골라 주세요</option>
      </select>
    </div>
  </header>

  <!-- 본문 영역 -->
  <main class="container">
    <!-- 공기 신호등: 지역 대표 상태를 크게 보여주는 상자 -->
    <section id="signal" class="signal grade-none">
      <!-- 불러오는 동안 보이는 표시 -->
      <div id="loading" class="loading" hidden>
        <!-- 빙글빙글 도는 아이콘 -->
        <span class="spinner" aria-hidden="true"></span>
        <!-- 불러오는 중 문구 -->
        <span>불러오는 중...</span>
      </div>
      <!-- 신호등 내용 (불러오는 동안에는 숨긴다) -->
      <div id="signal-content" class="signal-content">
        <!-- 어느 지역인지 보여준다 -->
        <p id="signal-region" class="signal-region">지역을 고르면 공기 상태가 표시됩니다</p>
        <!-- 이모지와 등급 글자를 크게 보여준다 -->
        <p class="signal-main">
          <!-- 등급 이모지 -->
          <span id="signal-emoji" class="signal-emoji">⚪</span>
          <!-- 등급 글자 -->
          <span id="signal-label" class="signal-label">대기 중</span>
        </p>
        <!-- 평균 미세먼지 수치 -->
        <p class="signal-value"><span id="signal-number">--</span><span class="unit">㎍/㎥</span></p>
        <!-- 한 줄 안내 문구 -->
        <p id="signal-message" class="signal-message"></p>
        <!-- 평균에 쓴 측정소 수와 측정 시각 -->
        <p id="signal-detail" class="signal-detail"></p>
      </div>
    </section>

    <!-- 안내 문구 (오류 등) -->
    <p id="status" class="status"></p>

    <!-- 측정소 지도 영역 -->
    <section id="map-section" class="panel" hidden>
      <!-- 지도 제목 -->
      <h2 class="panel-title">측정소 지도</h2>
      <!-- Leaflet이 지도를 그릴 자리 -->
      <div id="map" class="map"></div>
      <!-- 지도에 표시할 좌표가 없을 때 문구 -->
      <p id="map-empty" class="chart-empty" hidden>측정소 위치 정보를 불러오지 못했어요</p>
    </section>

    <!-- 측정소별 미세먼지 막대그래프 영역 -->
    <section id="chart-section" class="panel" hidden>
      <!-- 그래프 제목 -->
      <h2 class="panel-title">미세먼지 높은 측정소 TOP 10</h2>
      <!-- 그래프 크기를 정하는 상자 -->
      <div id="chart-box" class="chart-box">
        <!-- Chart.js가 그림을 그릴 캔버스 -->
        <canvas id="pm10-chart" aria-label="측정소별 미세먼지 막대그래프" role="img"></canvas>
      </div>
      <!-- 그래프로 보여줄 값이 없을 때 문구 -->
      <p id="chart-empty" class="chart-empty" hidden>그래프로 보여줄 측정값이 없어요</p>
    </section>

    <!-- 측정소 카드 영역 제목 (데이터가 있을 때만 보인다) -->
    <h2 id="card-title" class="section-title" hidden>측정소별 현황</h2>
    <!-- 측정소 카드들이 들어갈 자리 -->
    <section id="card-list" class="card-list"></section>

    <!-- 등급 색상 안내 -->
    <footer class="legend">
      <!-- 좋음 안내 -->
      <span class="legend-item grade-1"><i class="dot"></i>🔵 좋음</span>
      <!-- 보통 안내 -->
      <span class="legend-item grade-2"><i class="dot"></i>🟢 보통</span>
      <!-- 나쁨 안내 -->
      <span class="legend-item grade-3"><i class="dot"></i>🟠 나쁨</span>
      <!-- 매우나쁨 안내 -->
      <span class="legend-item grade-4"><i class="dot"></i>🔴 매우나쁨</span>
      <!-- 등급 없음 안내 -->
      <span class="legend-item grade-none"><i class="dot"></i>⚪ 등급 없음</span>
    </footer>
  </main>

  <!-- 지도 라이브러리 Leaflet을 CDN에서 불러온다 (app.js보다 먼저) -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <!-- 그래프 라이브러리 Chart.js를 CDN에서 불러온다 (app.js보다 먼저) -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <!-- 동작을 담당하는 자바스크립트 파일을 연결한다 -->
  <script src="app.js"></script>
</body>
</html>
